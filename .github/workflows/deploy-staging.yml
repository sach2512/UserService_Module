name: "Deploy to Staging & Optional Resume"

on:
  push:
    branches:
      - staging   # Auto-trigger on staging commits

  # Manual trigger with input
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run (full, load-test, swap)"
        required: true
        default: "full"

jobs:
  # 🏗️ 1. Build
  restore-and-build:
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.event.inputs.stage == 'full'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore --verbosity quiet

      - name: Build app
        run: dotnet build --configuration Release --no-restore --verbosity quiet

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/net8.0/
          if-no-files-found: error

  # 🧪 2. Unit Tests
  unit-tests:
    runs-on: ubuntu-22.04
    needs: restore-and-build
    if: github.event_name == 'push' && github.event.inputs.stage == 'full'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Run Unit Tests
        run: |
          dotnet test ./UserService.Tests/UserService.Tests.csproj \
            --configuration Release \
            --filter "Category=Unit" \
            --no-build --verbosity normal

  # 🔗 3. Integration Tests
  integration-tests:
    runs-on: ubuntu-22.04
    needs: unit-tests
    if: github.event_name == 'push' && github.event.inputs.stage == 'full'

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Run Integration Tests
        env:
          ConnectionStrings__MyConnectionString: "Server=localhost,1433;Database=UserServiceDBFinal;User Id=sa;Password=${{ secrets.SQL_PASSWORD }};TrustServerCertificate=True;"
        run: |
          dotnet test ./UserService.Tests/UserService.Tests.csproj \
            --configuration Release \
            --filter "Category=Integration" \
            --no-build --verbosity normal

  # ☁️ 4. Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-22.04
    needs: [integration-tests]
    if: github.event_name == 'push' && github.event.inputs.stage == 'full'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish app
        run: dotnet publish UserService.API/UserService.API.csproj -c Release -o ./publish --verbosity quiet

      - name: Deploy to Azure Web App (Stagging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: "UserService"
          slot-name: "stagging"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: ./publish

  # 💥 5. Load Testing
  load-test:
    name: "Run Load Tests on Stagging"
    runs-on: ubuntu-22.04
    needs: deploy-staging
    if: github.event.inputs.stage == 'load-test' || github.event.inputs.stage == 'full'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install and Configure JMeter
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openjdk-17-jre-headless wget unzip
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.zip
          unzip -q apache-jmeter-5.6.3.zip
          JMETER_HOME=$(pwd)/apache-jmeter-5.6.3
          echo "$JMETER_HOME/bin" >> $GITHUB_PATH

      - name: Verify JMeter Installation
        run: jmeter --version

      - name: Run JMeter Load Test (User Login 100 Loops)
        run: |
          echo "🚀 Running JMeter test..."
          jmeter -n -t ./loadtests/UserLoginSingleUser100Loops.jmx \
                 -l ./results/results.jtl \
                 -e -o ./results/report

      - name: Parse JMeter Results
        run: |
          if grep -q "500" ./results/results.jtl; then
            echo "❌ Load test failed: 500 errors detected!"
            exit 1
          elif grep -q "false" ./results/results.jtl; then
            echo "❌ Load test failed: Request failures found!"
            exit 1
          else
            echo "✅ Load test passed successfully!"
          fi

      - name: Upload Load Test Report
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: ./results/report

  # 🔁 6. Swap Stagging → Production
  swap-to-production:
    name: "Swap Stagging → Production"
    runs-on: ubuntu-22.04
    needs: load-test
    if: github.event.inputs.stage == 'swap' || github.event.inputs.stage == 'full'

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Swap stagging slot to production
        run: |
          az webapp deployment slot swap \
            --resource-group Ecommerce_Project \
            --name UserService \
            --slot stagging \
            --target-slot production
