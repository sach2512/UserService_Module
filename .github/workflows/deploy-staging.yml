name: "Deploy to Staging"

on:
  push:
    branches:
      - staging   # 👈 Trigger only when pushing to staging

jobs:
  # 🏗️ 1. Build job
  restore-and-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore --verbosity quiet

      - name: Build app
        run: dotnet build --configuration Release --no-restore --verbosity quiet

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            **/bin/Release/net8.0/
          if-no-files-found: error


 
  unit-tests:
    runs-on: ubuntu-22.04
    needs: restore-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Discover tests
        run: dotnet test ./UserService.Tests/UserService.Tests.csproj --list-tests --configuration Release

      - name: Run Unit Tests
        run: |
          echo "🧪 Running UNIT tests..."
          dotnet test ./UserService.Tests/UserService.Tests.csproj \
            --configuration Release \
            --filter "Category=Unit" \
            --no-build --verbosity normal



  # 🔗 3. Integration Tests job
  integration-tests:
    runs-on: ubuntu-22.04
    needs: unit-tests

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --name sqlserver-test
          --hostname sqlserver-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Install SQL tools
        run: |
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools unixodbc-dev
          echo 'export PATH="$PATH:/opt/mssql-tools/bin"' >> ~/.bashrc
          source ~/.bashrc

      - name: Wait for SQL Server to start and show logs
        run: |
          echo "⏳ Waiting 30s for SQL Server to initialize..."
          sleep 30
          echo "🐳 Docker containers running:"
          docker ps -a
          echo "📜 SQL Server logs:"
          docker logs sqlserver-test || true

      - name: Check SQL Connection
        run: |
          echo "🔍 Testing SQL Server connectivity..."
          for i in {1..3}; do
            sqlcmd -S localhost,1433 -U sa -P "${{ secrets.SQL_PASSWORD }}" -Q "SELECT name FROM sys.databases" && break
            echo "⚠️ Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "✅ SQL connection successful (or max retries reached)."

      - name: Create Integration Test Database
        run: |
          sqlcmd -S localhost,1433 -U sa -P "${{ secrets.SQL_PASSWORD }}" -Q "CREATE DATABASE UserServiceDBFinal"
          echo "✅ Created test DB: UserServiceDBFinal"

      - name: Run Integration Tests
        env:
          ConnectionStrings__MyConnectionString: "Server=localhost,1433;Database=UserServiceDBFinal;User Id=sa;Password=${{ secrets.SQL_PASSWORD }};TrustServerCertificate=True;"
        run: |
          echo "🚀 Running INTEGRATION tests..."
          dotnet test ./UserServiceTests.test/UserServiceTests.test.csproj \
            --configuration Release \
            --filter "Category=Integration" \
            --no-build --verbosity normal


  # ☁️ 4. Deploy to Staging job
  deploy-staging:
    runs-on: ubuntu-22.04
    needs: [unit-tests, integration-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish app
        run: dotnet publish UserService.API/UserService.API.csproj -c Release -o ./publish --verbosity quiet

      - name: Deploy to Azure Web App (Staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: "UserService"
          slot-name: "stagging"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: ./publish


  # 💥 5. Load Testing job
  load-test:
    name: "Run Load Tests on Staging"
    runs-on: ubuntu-22.04
    needs: deploy-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install JMeter
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openjdk-17-jre-headless wget unzip
          wget https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.zip
          unzip apache-jmeter-5.6.3.zip
          export PATH=$PATH:$(pwd)/apache-jmeter-5.6.3/bin

      - name: Run JMeter Load Test
        run: |
          jmeter -n -t ./loadtests/UserLoginTest.jmx -l ./results/results.jtl -e -o ./results/report || true

      - name: Parse JMeter Results
        run: |
          if grep -q "500" ./results/results.jtl; then
            echo "❌ Load test failed due to 500 errors"
            exit 1
          else
            echo "✅ Load test passed"
          fi

      - name: Upload Load Test Report
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: ./results/report


  # 🔁 6. Swap Staging → Production job
  swap-to-production:
    name: "Swap Slots (Staging → Production)"
    runs-on: ubuntu-22.04
    needs: load-test
    if: success()

    steps:
      - name: Swap staging slot to production
        uses: azure/webapps-deploy@v3
        with:
          app-name: "UserService"
          slot-name: "stagging"
          action: "swap"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
