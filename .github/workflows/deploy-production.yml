name: "Deploy to Production"

on:
  push:
    branches:
      - main         # 👈 trigger only when pushing to main

jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build app
        run: dotnet build --configuration Release

  unit-tests:
    runs-on: ubuntu-latest
    needs: restore-and-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Unit Tests
        run: |
              dotnet restore ./UserService.sln
              dotnet test ./UserService.Tests/UserService.Tests.csproj --verbosity normal




  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Integration Tests
        run:  dotnet test ./UserService.Tests/UserService.Tests.csproj --configuration Release --no-build --verbosity minimal

  deploy-production:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]   # 👈 deploy only if both test jobs succeed
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish app
        run: dotnet publish UserService.API/UserService.API.csproj -c Release -o ./publish

      - name: Deploy to Azure Web App (Production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: "user-service-prod"   # 👈 your production web app name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: ./publish
