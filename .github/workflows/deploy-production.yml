name: "Deploy to Production"

on:
  push:
    branches:
      - main

jobs:
  restore-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore --verbosity quiet

      - name: Build app
        run: dotnet build --configuration Release --no-restore --verbosity quiet


  unit-tests:
    runs-on: ubuntu-latest
    needs: restore-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 🧩 DEBUG: List all discovered tests before running
      - name: Discover tests
        run: dotnet test ./UserService.Tests/UserService.Tests.csproj --list-tests --configuration Release

      # 🧪 Run only "pure" unit tests (no DB dependencies)
      # Adjust filter if you have [Trait("Category","Unit")] or namespace-based grouping
      - name: Run Unit Tests
        run: |
          echo "🔍 Running UNIT tests only..."
          dotnet test ./UserService.Tests/UserService.Tests.csproj --configuration Release --filter "Category=Unit" --no-build --verbosity normal || echo "❌ Unit tests failed"


  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -Q 'SELECT 1'" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Wait for SQL Server to start
        run: sleep 30

      # 🧩 DEBUG: Test SQL connectivity before running integration tests
      - name: Check SQL Connection
        run: |
          echo "🔍 Checking SQL Server connectivity..."
          /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "${{ secrets.SQL_PASSWORD }}" -Q "SELECT name FROM sys.databases"
          echo "✅ SQL connection successful."

      - name: Create Integration Test Database
        run: |
          /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${{ secrets.SQL_PASSWORD }}" -Q "CREATE DATABASE UserServiceDBFinal"
          echo "✅ Created test DB: UserServiceDBFinal"

      - name: Run Integration Tests
        env:
          ConnectionStrings__MyConnectionString: "Server=localhost,1433;Database=UserServiceDBFinal;User Id=sa;Password=${{ secrets.SQL_PASSWORD }};TrustServerCertificate=True;"
        run: |
          echo "🚀 Running INTEGRATION tests..."
          dotnet test ./UserService.Tests/UserService.Tests.csproj --configuration Release --filter "Category=Integration" --no-build --verbosity normal || echo "❌ Integration tests failed"


  deploy-production:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish app
        run: dotnet publish UserService.API/UserService.API.csproj -c Release -o ./publish --verbosity quiet

      - name: Deploy to Azure Web App (Production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: "user-service-prod"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: ./publish
