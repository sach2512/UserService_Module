name: "Deploy to Production"

on:
  push:
    branches:
      - main   # Trigger only when pushing to main

jobs:
  restore-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore --verbosity quiet

      - name: Build app
        run: dotnet build --configuration Release --no-restore --verbosity quiet


  unit-tests:
    runs-on: ubuntu-latest
    needs: restore-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 🔍 Debug: List discovered tests
      - name: Discover tests
        run: dotnet test ./UserService.Tests/UserService.Tests.csproj --list-tests --configuration Release

      # 🧪 Run Unit Tests (only)
      - name: Run Unit Tests
        run: |
          echo "🧪 Running UNIT tests..."
          dotnet test ./UserService.Tests/UserService.Tests.csproj \
            --configuration Release \
            --filter "Category=Unit" \
            --no-build --verbosity normal


  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '${SA_PASSWORD}' -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --name sqlserver-test
          --hostname sqlserver-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # ⏳ Wait for SQL Server startup and print logs
      - name: Wait for SQL Server to start
        run: |
          echo "⏳ Waiting 60s for SQL Server to initialize..."
          sleep 60
          echo "🐳 Docker containers running:"
          docker ps -a
          echo "📜 SQL Server logs:"
          docker logs sqlserver-test || true

      # 🔍 Test SQL Connection
      - name: Check SQL Connection
        run: |
          echo "🔍 Testing SQL Server connectivity..."
          /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "${{ secrets.SQL_PASSWORD }}" -Q "SELECT name FROM sys.databases"
          echo "✅ SQL connection successful."

      # 🧱 Create Test Database
      - name: Create Integration Test Database
        run: |
          /opt/mssql-tools/bin/sqlcmd -S localhost,1433 -U sa -P "${{ secrets.SQL_PASSWORD }}" -Q "CREATE DATABASE UserServiceDBFinal"
          echo "✅ Created test DB: UserServiceDBFinal"

      # 🚀 Run Integration Tests
      - name: Run Integration Tests
        env:
          ConnectionStrings__MyConnectionString: "Server=localhost,1433;Database=UserServiceDBFinal;User Id=sa;Password=${{ secrets.SQL_PASSWORD }};TrustServerCertificate=True;"
        run: |
          echo "🚀 Running INTEGRATION tests..."
          dotnet test ./UserService.Tests/UserService.Tests.csproj \
            --configuration Release \
            --filter "Category=Integration" \
            --no-build --verbosity normal


  deploy-production:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 📦 Publish Application
      - name: Publish app
        run: dotnet publish UserService.API/UserService.API.csproj -c Release -o ./publish --verbosity quiet

      # ☁️ Deploy to Azure Web App
      - name: Deploy to Azure Web App (Production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: "user-service-prod"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: ./publish
